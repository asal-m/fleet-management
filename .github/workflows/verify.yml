name: Full backend verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Fresh database and full suite without skips
        run: dotnet run --project tools/VerifyTests/VerifyTests.csproj --configuration Release
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: .scratch/full-suite/**/results/*.trx
          if-no-files-found: warn

  native-host:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Native host, OIDC socket smoke and full suite
        run: dotnet run --project tools/LocalDevelopment --configuration Release -- verify
      - name: Preserve native-host test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-host-test-results
          path: .scratch/local-development/**/results/*.trx
          if-no-files-found: warn
      - name: Remove this ephemeral job's dependencies
        if: always()
        run: docker compose -f docker-compose.dependencies.yml down --volumes --remove-orphans --rmi local
