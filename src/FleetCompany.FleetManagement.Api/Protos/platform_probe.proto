syntax = "proto3";

option csharp_namespace = "FleetCompany.FleetManagement.Api.Grpc";

package fleetcompany.fleetmanagement.v1;

service PlatformProbe {
  rpc GetStatus (StatusRequest) returns (StatusReply);
}

message StatusRequest {}

message StatusReply {
  string service = 1;
  string status = 2;
}
