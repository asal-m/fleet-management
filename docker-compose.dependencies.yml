name: fleetmanagement-dependencies
services:
  bootstrap:
    extends: {file: docker-compose.yml, service: bootstrap}
  postgres:
    extends: {file: docker-compose.yml, service: postgres}
    ports: !override ["127.0.0.1:${FLEET_DEPENDENCIES_POSTGRES_PORT:-56432}:5432"]
  redis:
    extends: {file: docker-compose.yml, service: redis}
    ports: !override ["127.0.0.1:${FLEET_DEPENDENCIES_REDIS_PORT:-57379}:6379"]
    # Redis has no persistence; avoid the image's unused anonymous /data volume after down.
    tmpfs: ["/data"]
  identity:
    extends: {file: docker-compose.yml, service: identity}
    environment:
      Identity__Issuer: http://127.0.0.1:${FLEET_DEPENDENCIES_IDENTITY_PORT:-56480}
    ports: !override ["127.0.0.1:${FLEET_DEPENDENCIES_IDENTITY_PORT:-56480}:8080"]
volumes:
  fleet-postgres:
  fleet-configuration:
  fleet-identity:
