name: fleetmanagement-local
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fleet_management
      POSTGRES_USER: ${FLEET_POSTGRES_USER:?Run scripts/Start-LocalDependencies.ps1}
      POSTGRES_PASSWORD: ${FLEET_POSTGRES_PASSWORD:?Run scripts/Start-LocalDependencies.ps1}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - fleet-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${FLEET_REDIS_PASSWORD:?Run scripts/Start-LocalDependencies.ps1}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  fleet-postgres:
